<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body><center><h1>Student Registartion Form</h1></center>

    <hr>

    <form>
    
        <label for="fullname"><b>Full Name:</b></label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
        <br><br>

        
        <label for="email"><b>Email:</b></label>
        <input type="email" id="email" name="email" placeholder="Enter valid email address">
        <br><br>

        
        <label for="password"><b>Password:</b></label>
        <input type="password" id="password" name="password" placeholder="Enter password">
        <br><br>

        
        <label><b>Gender:</b></label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="course"><b>Course:</b></label>
        <select id="course" name="course">
            <option value="">-- Select Course --</option>
            <option value="btech">B.Tech</option>
            <option value="bca">BCA</option>
            <option value="mca">MCA</option>
            <option value="mba">MBA</option>
        </select>
        <br><br>

    
        <label for="contact"><b>Contact No:</b></label>
        <input type="tel" id="contact" name="contact" placeholder="Enter phone number">
        <br><br>

    
        <label for="address"><b>Address:</b></label><br>
        <textarea id="address" name="address" rows="4" cols="45" placeholder="Enter your address"></textarea>
        <br><br>

        
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>

    <hr>

</body></html>
